name: Review Pipeline

on:
  workflow_call:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  review-pipeline:
    runs-on: ubuntu-latest
    concurrency:
      group: >-
        review-pipeline-${{ github.event.pull_request.number
          || github.event.issue.number
          || github.event.check_run.pull_requests[0].number
          || github.event.check_run.id
          || github.event.review.id }}
      cancel-in-progress: false
    steps:
      - name: Checkout pipeline scripts
        uses: actions/checkout@v5
        with:
          repository: fluffyx/github-workflows
          ref: main
          sparse-checkout: .github/scripts/review-pipeline
          sparse-checkout-cone-mode: false
      - name: Run review pipeline
        uses: actions/github-script@v8
        with:
          script: |
            const { run } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/review-pipeline/index.js`);
            await run({ github, context, core });
