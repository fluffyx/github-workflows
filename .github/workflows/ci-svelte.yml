name: CI (Svelte)

on:
  workflow_call:

permissions:
  contents: read
  packages: read

jobs:
  filter:
    name: ci-filter
    runs-on: ubuntu-latest
    outputs:
      ruby_tests_only: ${{ steps.classify.outputs.ruby_tests_only }}
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v6

      - uses: dorny/paths-filter@v3
        id: paths
        with:
          token: ''
          base: ${{ github.base_ref || github.event.repository.default_branch || 'main' }}
          filters: |
            ruby_tests:
              - 'spec/**'
              - '.rubocop.yml'
              - '.rubocop_todo.yml'
            non_ruby_tests_code:
              - '**'
              - '!spec/**'
              - '!.rubocop.yml'
              - '!.rubocop_todo.yml'
              - '!**/*.md'
            any_code:
              - '**'
              - '!**/*.md'

      - name: Classify changes
        id: classify
        run: |
          RUBY_TESTS="${{ steps.paths.outputs.ruby_tests }}"
          NON_RUBY_TESTS="${{ steps.paths.outputs.non_ruby_tests_code }}"
          ANY_CODE="${{ steps.paths.outputs.any_code }}"
          if [ "$RUBY_TESTS" = "true" ] && [ "$NON_RUBY_TESTS" = "false" ]; then
            printf 'ruby_tests_only=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'ruby_tests_only=false\n' >> "$GITHUB_OUTPUT"
          fi
          if [ "$ANY_CODE" = "false" ]; then
            printf 'docs_only=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'docs_only=false\n' >> "$GITHUB_OUTPUT"
          fi

  discover_frontends:
    name: discover
    runs-on: ubuntu-latest
    outputs:
      has_frontends: ${{ steps.find.outputs.has_frontends }}
    steps:
      - uses: actions/checkout@v6

      - name: Find frontend directories
        id: find
        run: |
          if compgen -G 'frontend*/' > /dev/null 2>&1; then
            echo "has_frontends=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_frontends=false" >> "$GITHUB_OUTPUT"
          fi

  audit_frontend:
    name: audit
    needs: [discover_frontends, filter]
    if: "!cancelled() && needs.discover_frontends.outputs.has_frontends == 'true' && (needs.filter.result != 'success' || (needs.filter.outputs.ruby_tests_only != 'true' && needs.filter.outputs.docs_only != 'true'))"
    runs-on: ubuntu-latest
    env:
      GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend*/pnpm-lock.yaml
          registry-url: https://npm.pkg.github.com

      - name: Configure GitHub Packages auth
        if: env.GH_PACKAGES_TOKEN != ''
        run: |
          printf '@fluffyx:registry=https://npm.pkg.github.com\n//npm.pkg.github.com/:_authToken=${GH_PACKAGES_TOKEN}\n' >"$RUNNER_TEMP/.npmrc"
          echo "NPM_CONFIG_USERCONFIG=$RUNNER_TEMP/.npmrc" >> "$GITHUB_ENV"

      - if: env.GH_PACKAGES_TOKEN != ''
        run: git config --global url."https://x-access-token:${GH_PACKAGES_TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Install frontend dependencies
        run: |
          for dir in frontend*/; do
            [ -f "$dir/package.json" ] || continue
            echo "==> Installing $dir"
            pnpm --dir "$dir" install --frozen-lockfile
          done

      - name: Audit
        run: bin/audit-frontend

  check_frontend:
    name: check
    needs: [discover_frontends, filter]
    if: "!cancelled() && needs.discover_frontends.outputs.has_frontends == 'true' && (needs.filter.result != 'success' || (needs.filter.outputs.ruby_tests_only != 'true' && needs.filter.outputs.docs_only != 'true'))"
    runs-on: ubuntu-latest
    env:
      GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend*/pnpm-lock.yaml
          registry-url: https://npm.pkg.github.com

      - name: Configure GitHub Packages auth
        if: env.GH_PACKAGES_TOKEN != ''
        run: |
          printf '@fluffyx:registry=https://npm.pkg.github.com\n//npm.pkg.github.com/:_authToken=${GH_PACKAGES_TOKEN}\n' >"$RUNNER_TEMP/.npmrc"
          echo "NPM_CONFIG_USERCONFIG=$RUNNER_TEMP/.npmrc" >> "$GITHUB_ENV"

      - if: env.GH_PACKAGES_TOKEN != ''
        run: git config --global url."https://x-access-token:${GH_PACKAGES_TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Install frontend dependencies
        run: |
          for dir in frontend*/; do
            [ -f "$dir/package.json" ] || continue
            echo "==> Installing $dir"
            pnpm --dir "$dir" install --frozen-lockfile
          done

      - name: Check
        run: bin/check

  test_frontend:
    name: test
    needs: [discover_frontends, filter]
    if: "!cancelled() && needs.discover_frontends.outputs.has_frontends == 'true' && (needs.filter.result != 'success' || (needs.filter.outputs.ruby_tests_only != 'true' && needs.filter.outputs.docs_only != 'true'))"
    runs-on: ubuntu-latest
    env:
      GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend*/pnpm-lock.yaml
          registry-url: https://npm.pkg.github.com

      - name: Configure GitHub Packages auth
        if: env.GH_PACKAGES_TOKEN != ''
        run: |
          printf '@fluffyx:registry=https://npm.pkg.github.com\n//npm.pkg.github.com/:_authToken=${GH_PACKAGES_TOKEN}\n' >"$RUNNER_TEMP/.npmrc"
          echo "NPM_CONFIG_USERCONFIG=$RUNNER_TEMP/.npmrc" >> "$GITHUB_ENV"

      - if: env.GH_PACKAGES_TOKEN != ''
        run: git config --global url."https://x-access-token:${GH_PACKAGES_TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Install frontend dependencies
        run: |
          for dir in frontend*/; do
            [ -f "$dir/package.json" ] || continue
            echo "==> Installing $dir"
            pnpm --dir "$dir" install --frozen-lockfile
          done

      - name: Test
        run: bin/test-frontend
        env:
          COVERAGE: "true"
