name: CI (E2E)

on:
  workflow_call:
    inputs:
      e2e_shards:
        type: number
        default: 1

permissions:
  contents: read
  packages: read

jobs:
  discover:
    name: discover
    runs-on: ubuntu-latest
    outputs:
      skip_e2e: ${{ steps.classify.outputs.skip_e2e }}
      has_e2e: ${{ steps.find.outputs.has_e2e }}
      suites: ${{ steps.find.outputs.suites }}
      shards: ${{ steps.find.outputs.shards }}
      shard_total: ${{ steps.find.outputs.shard_total }}
    steps:
      - uses: actions/checkout@v6

      - uses: dorny/paths-filter@v3
        id: paths
        with:
          token: ''
          base: ${{ github.base_ref || github.event.repository.default_branch || 'main' }}
          filters: |
            e2e_relevant:
              - '**'
              - '!**/*.md'
              - '!spec/**'
              - '!.rubocop.yml'
              - '!.rubocop_todo.yml'
              - '!.github/**'
              - '!Dockerfile*'
              - '!docker-compose*'
              - '!.dockerignore'
              - '!render.yaml'
              - '!railway.toml'
              - '!.kamal/**'
              - '!deploy/**'
              - '!Procfile*'
              - '!Caddyfile*'
              - '!vercel.json'
              - '!.gitignore'
              - '!.gitattributes'
              - '!lefthook.yml'
              - '!conductor.json'
              - '!LICENSE'

      - name: Classify changes
        id: classify
        run: |
          E2E_RELEVANT="${{ steps.paths.outputs.e2e_relevant }}"
          if [ "$E2E_RELEVANT" = "false" ]; then
            printf 'skip_e2e=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'skip_e2e=false\n' >> "$GITHUB_OUTPUT"
          fi

      - name: Check for E2E tests
        id: find
        run: |
          suites=()
          for dir in frontend*/; do
            [ -d "${dir}tests/e2e" ] || continue
            suites+=("${dir%/}")
          done
          shards_n="${{ inputs.e2e_shards }}"
          shards_n="${shards_n%%.*}"
          shards_n=$(( shards_n > 0 ? shards_n : 1 ))
          if [ ${#suites[@]} -gt 0 ] && [ -x bin/dev-e2e ]; then
            echo "has_e2e=true" >> "$GITHUB_OUTPUT"
            echo "suites=$(jq -cn '$ARGS.positional' --args "${suites[@]}")" >> "$GITHUB_OUTPUT"
            echo "shards=$(jq -cn '[range(1; $n+1)]' --argjson n "$shards_n")" >> "$GITHUB_OUTPUT"
            echo "shard_total=$shards_n" >> "$GITHUB_OUTPUT"
          else
            echo "has_e2e=false" >> "$GITHUB_OUTPUT"
            echo "suites=[]" >> "$GITHUB_OUTPUT"
            echo "shards=[1]" >> "$GITHUB_OUTPUT"
            echo "shard_total=1" >> "$GITHUB_OUTPUT"
          fi

  e2e:
    name: "${{ matrix.suite }} / test ${{ matrix.shard }} of ${{ needs.discover.outputs.shard_total }}"
    needs: [discover]
    if: "!cancelled() && needs.discover.result == 'success' && needs.discover.outputs.has_e2e == 'true' && needs.discover.outputs.skip_e2e != 'true'"
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJson(needs.discover.outputs.suites) }}
        shard: ${{ fromJson(needs.discover.outputs.shards) }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DB_HOST: localhost
      DB_USER: postgres
      DB_PASSWORD: postgres
      RAILS_ENV: test
      DEV_PORT: "4100"
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
      VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_TEST_PUBLISHABLE_KEY }}
      GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
      BUNDLE_RUBYGEMS__PKG__GITHUB__COM: ${{ secrets.GH_PACKAGES_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - name: Configure git auth for private deps
        if: env.GH_PACKAGES_TOKEN != ''
        run: git config --global url."https://x-access-token:${GH_PACKAGES_TOKEN}@github.com/".insteadOf "https://github.com/"

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - uses: pnpm/action-setup@v5
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend*/pnpm-lock.yaml
          registry-url: https://npm.pkg.github.com

      - name: Configure GitHub Packages auth
        if: env.GH_PACKAGES_TOKEN != ''
        run: |
          printf '@fluffyx:registry=https://npm.pkg.github.com\n//npm.pkg.github.com/:_authToken=${GH_PACKAGES_TOKEN}\n' >"$RUNNER_TEMP/.npmrc"
          echo "NPM_CONFIG_USERCONFIG=$RUNNER_TEMP/.npmrc" >> "$GITHUB_ENV"

      - name: Install frontend dependencies
        run: |
          for dir in frontend*/; do
            [ -f "$dir/package.json" ] || continue
            echo "==> Installing $dir"
            pnpm --dir "$dir" install --frozen-lockfile
          done

      - name: Resolve Caddy arch
        id: caddy-arch
        run: |
          case "${{ runner.arch }}" in
            X64)   echo "arch=amd64" >> "$GITHUB_OUTPUT" ;;
            ARM64) echo "arch=arm64" >> "$GITHUB_OUTPUT" ;;
            *) echo "Unsupported arch: ${{ runner.arch }}" >&2; exit 1 ;;
          esac

      - name: Cache Caddy binary
        id: caddy-cache
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/caddy
          key: caddy-${{ runner.os }}-${{ runner.arch }}-2.9.1

      - name: Download Caddy
        if: steps.caddy-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL "https://github.com/caddyserver/caddy/releases/download/v2.9.1/caddy_2.9.1_linux_${{ steps.caddy-arch.outputs.arch }}.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" caddy

      - name: Install Caddy
        run: |
          sudo cp "$RUNNER_TEMP/caddy" /usr/local/bin/caddy
          sudo chmod +x /usr/local/bin/caddy

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend*/pnpm-lock.yaml') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        run: |
          for dir in frontend*/; do
            [ -f "$dir/package.json" ] || continue
            pnpm --dir "$dir" exec playwright install --with-deps chromium
          done

      - name: Prepare database
        run: bin/rails db:test:prepare

      - name: Generate GraphQL types
        run: |
          for dir in frontend*/; do
            [ -f "$dir/package.json" ] || continue
            pnpm --dir "$dir" run --if-present codegen
          done

      - name: Start dev server
        run: |
          mkdir -p tmp/logs
          setsid bin/dev-e2e </dev/null >tmp/logs/dev-e2e.log 2>&1 &
          echo "DEV_E2E_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for dev server
        run: |
          timeout 120 bash -c "until curl -sf http://app.lvh.me:${DEV_PORT} > /dev/null 2>&1; do sleep 2; done"

      - name: Run E2E tests
        run: |
          (cd "$SUITE" && npx playwright test --config tests/e2e/playwright.config.ts --shard=${{ matrix.shard }}/${{ needs.discover.outputs.shard_total }} --max-failures 1)
        env:
          CI: "true"
          DEV_E2E_RUNNING: "true"
          SUITE: ${{ matrix.suite }}

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-${{ matrix.suite }}-shard${{ matrix.shard }}
          path: |
            frontend*/test-results/
            tmp/logs/
          retention-days: 7
          if-no-files-found: ignore

      - name: Stop dev server
        if: always()
        run: kill -- "-$DEV_E2E_PID" 2>/dev/null || kill "$DEV_E2E_PID" 2>/dev/null || true
