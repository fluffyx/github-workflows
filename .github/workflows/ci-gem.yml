name: CI (Gem)

on:
  workflow_call:

permissions:
  contents: read
  packages: read

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      BUNDLE_RUBYGEMS__PKG__GITHUB__COM: ${{ secrets.GH_PACKAGES_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Bundler Audit
        id: bundler-audit
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          bundle exec bundler-audit 2>&1 | tee "$RUNNER_TEMP/bundler-audit-output.txt"

      - name: Classify audit result
        if: steps.bundler-audit.outcome == 'failure'
        run: |
          if grep -qE 'Errno::(ECONNREFUSED|ECONNRESET|ETIMEDOUT|EHOSTUNREACH)|SocketError|Net::(Open|Read)Timeout' "$RUNNER_TEMP/bundler-audit-output.txt"; then
            printf '::warning::Bundler Audit skipped — advisory database unreachable (network error)\n'
          else
            printf '::error::Bundler Audit found vulnerabilities\n'
            exit 1
          fi

  check:
    runs-on: ubuntu-latest
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
      BUNDLE_RUBYGEMS__PKG__GITHUB__COM: ${{ secrets.GH_PACKAGES_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - uses: actions/cache@v5
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.ruby-version', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: RuboCop
        run: bundle exec rubocop -f github

  test:
    runs-on: ubuntu-latest
    env:
      BUNDLE_RUBYGEMS__PKG__GITHUB__COM: ${{ secrets.GH_PACKAGES_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: RSpec
        run: bundle exec rspec
