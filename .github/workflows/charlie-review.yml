name: Request Charlie Review

on:
  workflow_call:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  pipeline:
    runs-on: ubuntu-latest
    concurrency:
      group: >-
        pipeline-${{ github.event.pull_request.number
          || github.event.issue.number
          || github.event.check_run.pull_requests[0].number
          || github.event.check_run.id
          || github.event.review.id }}
      cancel-in-progress: false
    steps:
      - name: Checkout pipeline scripts
        uses: actions/checkout@v5
        with:
          repository: fluffyx/github-workflows
          ref: main
          token: ${{ secrets.GH_PACKAGES_TOKEN || github.token }}
          sparse-checkout: .github/scripts/review-pipeline
          sparse-checkout-cone-mode: false
      - name: Run review pipeline
        uses: actions/github-script@v8
        with:
          script: |
            const { run } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/review-pipeline/index.js`);
            await run({ github, context, core });

  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: fluffyx/github-workflows/actions/check-version@main
