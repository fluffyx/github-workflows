name: Request Charlie Review

on:
  workflow_call:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  check_suite:
    types: [completed]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  remove-reviewer:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Remove CharlieHelps as reviewer
        uses: actions/github-script@v8
        with:
          script: |
            try {
              await github.rest.pulls.removeRequestedReviewers({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.payload.pull_request.number,
                reviewers: ['CharlieHelps'],
              });
            } catch {}

  pipeline:
    if: >-
      github.event_name == 'workflow_call' ||
      (github.event_name == 'check_suite' &&
      github.event.check_suite.conclusion == 'success' &&
      github.event.check_suite.pull_requests[0] != '' &&
      !contains(fromJSON('["coderabbitai","vercel","cloudflare-workers-and-pages","sentry","render","charliecreates"]'), github.event.check_suite.app.slug))
    runs-on: ubuntu-latest
    concurrency:
      group: >-
        pipeline-${{ github.event.pull_request.number
          || github.event.issue.number
          || github.event.check_suite.pull_requests[0].number
          || github.event.check_run.pull_requests[0].number
          || github.event.check_run.id
          || github.event.review.id }}
      cancel-in-progress: false
    steps:
      - name: Checkout pipeline scripts
        uses: actions/checkout@v5
        with:
          repository: fluffyx/github-workflows
          ref: main
          token: ${{ secrets.GH_PACKAGES_TOKEN || github.token }}
          sparse-checkout: .github/scripts/review-pipeline
          sparse-checkout-cone-mode: false
      - name: Run review pipeline
        uses: actions/github-script@v8
        with:
          script: |
            const { run } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/review-pipeline/index.js`);
            await run({ github, context, core });

  version:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_call'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: fluffyx/github-workflows/actions/check-version@main
