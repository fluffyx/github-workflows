name: Request Charlie Review

on:
  workflow_call:
    inputs:
      greptile:
        description: Auto-trigger Greptile review after Charlie approves
        type: boolean
        default: false

permissions:
  contents: read
  checks: write
  issues: write
  pull-requests: write

jobs:
  review-pipeline:
    runs-on: ubuntu-latest
    concurrency:
      group: >-
        review-pipeline-${{ github.event.pull_request.number
          || github.event.issue.number
          || github.event.check_run.pull_requests[0].number
          || github.event.check_run.id
          || github.event.review.id }}
      cancel-in-progress: false
    steps:
      - name: Checkout pipeline scripts
        uses: actions/checkout@v5
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          token: ${{ secrets.GH_PACKAGES_TOKEN || github.token }}
          sparse-checkout: .github/scripts/review-pipeline
          sparse-checkout-cone-mode: false
      - name: Run review pipeline
        uses: actions/github-script@v8
        env:
          INPUT_GREPTILE: ${{ inputs.greptile }}
        with:
          script: |
            const { run } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/review-pipeline/index.js`);
            const options = { greptile: process.env.INPUT_GREPTILE === 'true' };
            await run({ github, context, core, options });
