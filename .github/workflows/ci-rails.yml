name: CI (Rails)

on:
  workflow_call:
    inputs:
      e2e_shards:
        type: number
        default: 1

permissions:
  contents: read
  packages: read
  pull-requests: read

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: fluffyx/github-workflows/actions/check-version@main

  filter:
    name: ci-filter
    runs-on: ubuntu-latest
    outputs:
      frontend_only: ${{ steps.classify.outputs.frontend_only }}
      docs_only: ${{ steps.classify.outputs.docs_only }}
      skip_e2e: ${{ steps.classify.outputs.skip_e2e }}
    steps:
      - uses: actions/checkout@v6

      - uses: dorny/paths-filter@v3
        id: paths
        with:
          base: ${{ github.base_ref || github.event.repository.default_branch || 'main' }}
          filters: |
            frontend:
              - 'frontend*/**'
            non_frontend_code:
              - '**'
              - '!frontend*/**'
              - '!**/*.md'
            any_code:
              - '**'
              - '!**/*.md'
            e2e_relevant:
              - '**'
              - '!**/*.md'
              - '!spec/**'
              - '!.rubocop.yml'
              - '!.rubocop_todo.yml'
              - '!.github/**'
              - '!Dockerfile*'
              - '!docker-compose*'
              - '!.dockerignore'
              - '!render.yaml'
              - '!railway.toml'
              - '!.kamal/**'
              - '!deploy/**'
              - '!Procfile*'
              - '!Caddyfile*'
              - '!vercel.json'
              - '!.gitignore'
              - '!.gitattributes'
              - '!lefthook.yml'
              - '!conductor.json'
              - '!LICENSE'

      - name: Classify changes
        id: classify
        run: |
          FRONTEND="${{ steps.paths.outputs.frontend }}"
          NON_FRONTEND="${{ steps.paths.outputs.non_frontend_code }}"
          ANY_CODE="${{ steps.paths.outputs.any_code }}"
          if [ "$FRONTEND" = "true" ] && [ "$NON_FRONTEND" = "false" ]; then
            printf 'frontend_only=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'frontend_only=false\n' >> "$GITHUB_OUTPUT"
          fi
          if [ "$ANY_CODE" = "false" ]; then
            printf 'docs_only=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'docs_only=false\n' >> "$GITHUB_OUTPUT"
          fi
          E2E_RELEVANT="${{ steps.paths.outputs.e2e_relevant }}"
          if [ "$E2E_RELEVANT" = "false" ]; then
            printf 'skip_e2e=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'skip_e2e=false\n' >> "$GITHUB_OUTPUT"
          fi

  discover_e2e:
    runs-on: ubuntu-latest
    outputs:
      has_e2e: ${{ steps.find.outputs.has_e2e }}
      suites: ${{ steps.find.outputs.suites }}
      shards: ${{ steps.find.outputs.shards }}
    steps:
      - uses: actions/checkout@v6

      - name: Check for E2E tests
        id: find
        run: |
          suites=()
          for dir in frontend*/; do
            [ -d "${dir}tests/e2e" ] || continue
            suites+=("${dir%/}")
          done
          if [ ${#suites[@]} -gt 0 ] && [ -x bin/dev-e2e ]; then
            printf 'has_e2e=true\n' >> "$GITHUB_OUTPUT"
            printf 'suites=%s\n' "$(jq -cn '$ARGS.positional' --args "${suites[@]}")" >> "$GITHUB_OUTPUT"
            printf 'shards=%s\n' "$(jq -cn '[range(1; $n+1)]' --argjson n '${{ inputs.e2e_shards }}')" >> "$GITHUB_OUTPUT"
          else
            printf 'has_e2e=false\n' >> "$GITHUB_OUTPUT"
            printf 'suites=[]\n' >> "$GITHUB_OUTPUT"
            printf 'shards=[1]\n' >> "$GITHUB_OUTPUT"
          fi

  scan_ruby:
    name: scan
    needs: [filter]
    if: "!cancelled() && (needs.filter.result != 'success' || (needs.filter.outputs.frontend_only != 'true' && needs.filter.outputs.docs_only != 'true'))"
    runs-on: ubuntu-latest
    env:
      GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
      BUNDLE_RUBYGEMS__PKG__GITHUB__COM: ${{ secrets.GH_PACKAGES_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - name: Configure git auth for private deps
        if: env.GH_PACKAGES_TOKEN != ''
        run: git config --global url."https://x-access-token:${GH_PACKAGES_TOKEN}@github.com/".insteadOf "https://github.com/"

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Brakeman
        run: bin/brakeman --no-pager

      - name: Bundler Audit
        run: bin/bundler-audit

  lint:
    needs: [filter]
    if: "!cancelled() && (needs.filter.result != 'success' || (needs.filter.outputs.frontend_only != 'true' && needs.filter.outputs.docs_only != 'true'))"
    runs-on: ubuntu-latest
    env:
      GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
      RUBOCOP_CACHE_ROOT: tmp/rubocop
      BUNDLE_RUBYGEMS__PKG__GITHUB__COM: ${{ secrets.GH_PACKAGES_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - name: Configure git auth for private deps
        if: env.GH_PACKAGES_TOKEN != ''
        run: git config --global url."https://x-access-token:${GH_PACKAGES_TOKEN}@github.com/".insteadOf "https://github.com/"

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - uses: actions/cache@v5
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.ruby-version', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: RuboCop
        run: bin/rubocop -f github

  test:
    needs: [filter]
    if: "!cancelled() && (needs.filter.result != 'success' || (needs.filter.outputs.frontend_only != 'true' && needs.filter.outputs.docs_only != 'true'))"
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DB_HOST: localhost
      DB_USER: postgres
      DB_PASSWORD: postgres
      RAILS_ENV: test
      GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
      BUNDLE_RUBYGEMS__PKG__GITHUB__COM: ${{ secrets.GH_PACKAGES_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - name: Configure git auth for private deps
        if: env.GH_PACKAGES_TOKEN != ''
        run: git config --global url."https://x-access-token:${GH_PACKAGES_TOKEN}@github.com/".insteadOf "https://github.com/"

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Prepare database
        run: bin/rails db:test:prepare

      - name: RSpec
        run: bundle exec rspec
        env:
          COVERAGE: "true"

  pack:
    needs: [filter]
    if: "!cancelled() && (needs.filter.result != 'success' || (needs.filter.outputs.frontend_only != 'true' && needs.filter.outputs.docs_only != 'true'))"
    runs-on: ubuntu-latest
    env:
      GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
      BUNDLE_RUBYGEMS__PKG__GITHUB__COM: ${{ secrets.GH_PACKAGES_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - name: Configure git auth for private deps
        if: env.GH_PACKAGES_TOKEN != ''
        run: git config --global url."https://x-access-token:${GH_PACKAGES_TOKEN}@github.com/".insteadOf "https://github.com/"

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Gem build dry-run
        run: |
          found=false
          for gemspec in *.gemspec; do
            [ -f "$gemspec" ] || continue
            found=true
            echo "==> Building $gemspec"
            gem build "$gemspec"
          done
          if [ "$found" = false ]; then
            echo "No gemspec found — skipping"
          fi

  e2e:
    needs: [discover_e2e, filter]
    if: "!cancelled() && needs.discover_e2e.outputs.has_e2e == 'true' && (needs.filter.result != 'success' || needs.filter.outputs.skip_e2e != 'true')"
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJson(needs.discover_e2e.outputs.suites) }}
        shard: ${{ fromJson(needs.discover_e2e.outputs.shards) }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DB_HOST: localhost
      DB_USER: postgres
      DB_PASSWORD: postgres
      RAILS_ENV: test
      DEV_PORT: "4100"
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
      VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_TEST_PUBLISHABLE_KEY }}
      GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
      BUNDLE_RUBYGEMS__PKG__GITHUB__COM: ${{ secrets.GH_PACKAGES_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - name: Configure git auth for private deps
        if: env.GH_PACKAGES_TOKEN != ''
        run: git config --global url."https://x-access-token:${GH_PACKAGES_TOKEN}@github.com/".insteadOf "https://github.com/"

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - uses: pnpm/action-setup@v5
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend*/pnpm-lock.yaml
          registry-url: https://npm.pkg.github.com

      - name: Configure GitHub Packages auth
        if: env.GH_PACKAGES_TOKEN != ''
        run: |
          printf '@fluffyx:registry=https://npm.pkg.github.com\n//npm.pkg.github.com/:_authToken=${GH_PACKAGES_TOKEN}\n' >"$RUNNER_TEMP/.npmrc"
          echo "NPM_CONFIG_USERCONFIG=$RUNNER_TEMP/.npmrc" >> "$GITHUB_ENV"

      - name: Install frontend dependencies
        run: |
          for dir in frontend*/; do
            [ -f "$dir/package.json" ] || continue
            echo "==> Installing $dir"
            pnpm --dir "$dir" install --frozen-lockfile
          done

      - name: Install Caddy
        run: |
          sudo apt-get install -y debian-keyring debian-archive-keyring apt-transport-https curl
          curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/gpg.key' | sudo gpg --dearmor -o /usr/share/keyrings/caddy-stable-archive-keyring.gpg
          curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/debian.deb.txt' | sudo tee /etc/apt/sources.list.d/caddy-stable.list
          sudo apt-get update
          sudo apt-get install -y caddy

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend*/pnpm-lock.yaml') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        run: |
          for dir in frontend*/; do
            [ -f "$dir/package.json" ] || continue
            pnpm --dir "$dir" exec playwright install --with-deps chromium
          done

      - name: Prepare database
        run: bin/rails db:test:prepare

      - name: Generate GraphQL types
        run: |
          for dir in frontend*/; do
            [ -f "$dir/package.json" ] || continue
            pnpm --dir "$dir" run --if-present codegen
          done

      - name: Start dev server
        run: |
          mkdir -p tmp/logs
          setsid bin/dev-e2e </dev/null >tmp/logs/dev-e2e.log 2>&1 &
          echo "DEV_E2E_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for dev server
        run: |
          timeout 120 bash -c "until curl -sf http://app.lvh.me:${DEV_PORT} > /dev/null 2>&1; do sleep 2; done"

      - name: Run E2E tests
        run: |
          (cd "${{ matrix.suite }}" && npx playwright test --config tests/e2e/playwright.config.ts --shard=${{ matrix.shard }}/${{ inputs.e2e_shards }})
        env:
          CI: "true"
          DEV_E2E_RUNNING: "true"

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-${{ matrix.suite }}-shard${{ matrix.shard }}
          path: |
            frontend*/test-results/
            tmp/logs/
          retention-days: 7
          if-no-files-found: ignore

      - name: Stop dev server
        if: always()
        run: kill -- "-$DEV_E2E_PID" 2>/dev/null || kill "$DEV_E2E_PID" 2>/dev/null || true
