name: CI (Rails)

on:
  workflow_call:

permissions:
  contents: read
  packages: read

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: fluffyx/github-workflows/actions/check-version@main

  discover:
    name: discover
    runs-on: ubuntu-latest
    outputs:
      frontend_only: ${{ steps.classify.outputs.frontend_only }}
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v6

      - uses: dorny/paths-filter@v3
        id: paths
        with:
          token: ''
          base: ${{ github.base_ref || github.event.repository.default_branch || 'main' }}
          filters: |
            frontend:
              - 'frontend*/**'
            non_frontend_code:
              - '**'
              - '!frontend*/**'
              - '!**/*.md'
            any_code:
              - '**'
              - '!**/*.md'

      - name: Classify changes
        id: classify
        run: |
          FRONTEND="${{ steps.paths.outputs.frontend }}"
          NON_FRONTEND="${{ steps.paths.outputs.non_frontend_code }}"
          ANY_CODE="${{ steps.paths.outputs.any_code }}"
          if [ "$FRONTEND" = "true" ] && [ "$NON_FRONTEND" = "false" ]; then
            printf 'frontend_only=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'frontend_only=false\n' >> "$GITHUB_OUTPUT"
          fi
          if [ "$ANY_CODE" = "false" ]; then
            printf 'docs_only=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'docs_only=false\n' >> "$GITHUB_OUTPUT"
          fi

  audit-ruby:
    name: audit
    needs: [discover]
    if: "!cancelled() && (needs.discover.result != 'success' || (needs.discover.outputs.frontend_only != 'true' && needs.discover.outputs.docs_only != 'true'))"
    runs-on: ubuntu-latest
    env:
      GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
      BUNDLE_RUBYGEMS__PKG__GITHUB__COM: ${{ secrets.GH_PACKAGES_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - name: Configure git auth for private deps
        if: env.GH_PACKAGES_TOKEN != ''
        run: git config --global url."https://x-access-token:${GH_PACKAGES_TOKEN}@github.com/".insteadOf "https://github.com/"

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Brakeman
        run: bin/brakeman --no-pager

      - name: Bundler Audit
        id: bundler-audit
        continue-on-error: true
        shell: bash
        run: bin/bundler-audit 2>&1 | tee "$RUNNER_TEMP/bundler-audit-output.txt"

      - name: Classify audit result
        if: steps.bundler-audit.outcome == 'failure'
        run: |
          if grep -qE 'Errno::(ECONNREFUSED|ECONNRESET|ETIMEDOUT|EHOSTUNREACH)|SocketError|Net::(Open|Read)Timeout' "$RUNNER_TEMP/bundler-audit-output.txt"; then
            printf '::warning::Bundler Audit skipped — advisory database unreachable (network error)\n'
          else
            printf '::error::Bundler Audit found vulnerabilities\n'
            exit 1
          fi

  lint:
    needs: [discover]
    if: "!cancelled() && (needs.discover.result != 'success' || (needs.discover.outputs.frontend_only != 'true' && needs.discover.outputs.docs_only != 'true'))"
    runs-on: ubuntu-latest
    env:
      GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
      RUBOCOP_CACHE_ROOT: tmp/rubocop
      BUNDLE_RUBYGEMS__PKG__GITHUB__COM: ${{ secrets.GH_PACKAGES_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - name: Configure git auth for private deps
        if: env.GH_PACKAGES_TOKEN != ''
        run: git config --global url."https://x-access-token:${GH_PACKAGES_TOKEN}@github.com/".insteadOf "https://github.com/"

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - uses: actions/cache@v5
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.ruby-version', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: RuboCop
        run: bin/rubocop -f github

  test:
    needs: [discover]
    if: "!cancelled() && (needs.discover.result != 'success' || (needs.discover.outputs.frontend_only != 'true' && needs.discover.outputs.docs_only != 'true'))"
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DB_HOST: localhost
      DB_USER: postgres
      DB_PASSWORD: postgres
      RAILS_ENV: test
      GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
      BUNDLE_RUBYGEMS__PKG__GITHUB__COM: ${{ secrets.GH_PACKAGES_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - name: Configure git auth for private deps
        if: env.GH_PACKAGES_TOKEN != ''
        run: git config --global url."https://x-access-token:${GH_PACKAGES_TOKEN}@github.com/".insteadOf "https://github.com/"

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Prepare database
        run: bin/rails db:test:prepare

      - name: RSpec
        run: bundle exec rspec
        env:
          COVERAGE: "true"

  pack:
    needs: [discover]
    if: "!cancelled() && (needs.discover.result != 'success' || (needs.discover.outputs.frontend_only != 'true' && needs.discover.outputs.docs_only != 'true'))"
    runs-on: ubuntu-latest
    env:
      GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
      BUNDLE_RUBYGEMS__PKG__GITHUB__COM: ${{ secrets.GH_PACKAGES_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - name: Configure git auth for private deps
        if: env.GH_PACKAGES_TOKEN != ''
        run: git config --global url."https://x-access-token:${GH_PACKAGES_TOKEN}@github.com/".insteadOf "https://github.com/"

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Gem build dry-run
        run: |
          found=false
          for gemspec in *.gemspec; do
            [ -f "$gemspec" ] || continue
            found=true
            echo "==> Building $gemspec"
            gem build "$gemspec"
          done
          if [ "$found" = false ]; then
            echo "No gemspec found — skipping"
          fi
