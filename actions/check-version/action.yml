name: Check version sync
description: >
  Auto-discovers version-bearing files (VERSION, package.json, version.rb)
  and verifies they agree. Requires CHANGELOG.md to exist. Supports two
  changelog formats: semver (## [1.2.3]) and date (## [2026-04-12]).
  Auto-detects format from headings — mixing formats is not allowed.
  For semver changelogs, validates against discovered version sources.
  For date changelogs, validates ISO 8601 format and descending order.

runs:
  using: composite
  steps:
    - name: Check version sync
      shell: bash
      run: |
        set -euo pipefail

        semver_re='^[0-9]+\.[0-9]+\.[0-9]+$'
        date_re='^[0-9]{4}-[0-9]{2}-[0-9]{2}$'

        errors=()

        # --- Require CHANGELOG.md ---
        if [ ! -f CHANGELOG.md ]; then
          echo "::error::CHANGELOG.md is missing"
          exit 1
        fi

        # --- Auto-discover version sources ---
        versions=()
        sources=()

        if [ -f VERSION ]; then
          v=$(tr -d '[:space:]' < VERSION)
          if [[ ! "$v" =~ $semver_re ]]; then
            errors+=("VERSION file has invalid semver: $v")
          else
            versions+=("$v")
            sources+=("VERSION")
            echo "Found VERSION: $v"
          fi
        fi

        while IFS= read -r pj; do
          v=$(python3 -c "import json,sys; d=json.load(open(sys.argv[1])); print(d.get('version',''))" "$pj" 2>/dev/null || true)
          if [ -n "$v" ]; then
            if [[ ! "$v" =~ $semver_re ]]; then
              errors+=("$pj has invalid semver: $v")
            else
              versions+=("$v")
              sources+=("$pj")
              echo "Found $pj: $v"
            fi
          fi
        done < <(find . -name package.json -not -path '*/node_modules/*' -not -path '*/.git/*' -not -path '*/frontend*/*' | sort)

        while IFS= read -r vr; do
          v=$(grep -m1 -oP 'VERSION\s*=\s*["\x27]\K[^"\x27]+' "$vr" 2>/dev/null || true)
          if [ -n "$v" ]; then
            if [[ ! "$v" =~ $semver_re ]]; then
              errors+=("$vr has invalid semver: $v")
            else
              versions+=("$v")
              sources+=("$vr")
              echo "Found $vr: $v"
            fi
          fi
        done < <(find . -name version.rb -not -path '*/node_modules/*' -not -path '*/.git/*' | sort)

        # --- Compare all discovered versions ---
        if [ ${#versions[@]} -eq 0 ]; then
          echo "No version sources found — skipping version comparison"
        else
          canonical="${versions[0]}"
          for i in "${!versions[@]}"; do
            if [ "${versions[$i]}" != "$canonical" ]; then
              errors+=("Version mismatch: ${sources[0]} has $canonical but ${sources[$i]} has ${versions[$i]}")
            fi
          done
        fi

        # --- Check [Unreleased] position ---
        mapfile -t all_headings < <(grep -oP '^##\s+\[?\K[^\]\s—–]+' CHANGELOG.md)
        for i in "${!all_headings[@]}"; do
          if echo "${all_headings[$i]}" | grep -qi '^unreleased'; then
            if [ "$i" -ne 0 ]; then
              errors+=("[Unreleased] must be the first heading in CHANGELOG.md, but it appears at position $((i+1))")
            fi
          fi
        done

        # --- Check CHANGELOG headings ---
        if [ ${#all_headings[@]} -gt 0 ]; then
          mapfile -t raw_headings < <(printf '%s\n' "${all_headings[@]}" | grep -iv '^unreleased')
        else
          raw_headings=()
        fi

        for h in "${raw_headings[@]}"; do
          if [[ "$h" =~ ^v ]]; then
            errors+=("CHANGELOG.md uses v-prefix in heading: $h — use bare version numbers (e.g. 0.6.1)")
          fi
        done

        if [ ${#raw_headings[@]} -gt 0 ]; then
          mapfile -t headings < <(printf '%s\n' "${raw_headings[@]}" | sed 's/^v//')
        else
          headings=()
        fi

        # --- Detect changelog format: semver or date ---
        changelog_format=""
        if [ ${#headings[@]} -gt 0 ]; then
          semver_count=0
          date_count=0
          for h in "${headings[@]}"; do
            if [[ "$h" =~ $semver_re ]]; then
              ((semver_count++)) || true
            elif [[ "$h" =~ $date_re ]]; then
              ((date_count++)) || true
            fi
          done

          if [ "$semver_count" -gt 0 ] && [ "$date_count" -gt 0 ]; then
            errors+=("CHANGELOG.md mixes semver and date headings — pick one format")
          elif [ "$semver_count" -gt 0 ]; then
            changelog_format="semver"
          elif [ "$date_count" -gt 0 ]; then
            changelog_format="date"
          fi
        fi

        echo "Changelog format: ${changelog_format:-none detected}"

        # --- Validate headings based on format ---
        if [ "$changelog_format" = "semver" ]; then
          for h in "${headings[@]}"; do
            if [[ ! "$h" =~ $semver_re ]]; then
              errors+=("CHANGELOG.md has invalid semver in heading: $h")
            fi
          done
        elif [ "$changelog_format" = "date" ]; then
          for h in "${headings[@]}"; do
            if [[ ! "$h" =~ $date_re ]]; then
              errors+=("CHANGELOG.md has invalid date in heading: $h — use YYYY-MM-DD format")
            fi
          done
        else
          for h in "${headings[@]}"; do
            if [[ ! "$h" =~ $semver_re ]] && [[ ! "$h" =~ $date_re ]]; then
              errors+=("CHANGELOG.md has invalid heading: $h — use semver (1.2.3) or date (2026-04-12)")
            fi
          done
        fi

        # --- Check latest CHANGELOG version matches (semver only) ---
        if [ "$changelog_format" = "semver" ] && [ ${#versions[@]} -gt 0 ]; then
          canonical="${versions[0]}"
          latest_heading=$(grep -m1 -oP '^##\s+\[?\K[^\]]+' CHANGELOG.md || true)

          if [ -z "$latest_heading" ]; then
            errors+=("CHANGELOG.md has no version headings")
          elif echo "$latest_heading" | grep -qi '^unreleased'; then
            echo "Latest CHANGELOG heading is [Unreleased] — OK"
          else
            changelog_version="${latest_heading#v}"
            if [ "$changelog_version" != "$canonical" ]; then
              errors+=("CHANGELOG.md latest version is $changelog_version but version files say $canonical")
            else
              echo "CHANGELOG.md matches version: $changelog_version"
            fi
          fi
        elif [ "$changelog_format" = "date" ]; then
          echo "Date-based changelog — skipping version cross-reference"
        fi

        # --- Check CHANGELOG ordering ---
        if [ "$changelog_format" = "semver" ]; then
          valid_headings=()
          for h in "${headings[@]}"; do
            if [[ "$h" =~ $semver_re ]]; then
              valid_headings+=("$h")
            fi
          done

          if [ ${#valid_headings[@]} -ge 2 ]; then
            for ((i=0; i<${#valid_headings[@]}-1; i++)); do
              a="${valid_headings[$i]}"
              b="${valid_headings[$((i+1))]}"
              higher=$(printf '%s\n%s\n' "$a" "$b" | sort -t. -k1,1nr -k2,2nr -k3,3nr | head -1)
              if [ "$higher" != "$a" ]; then
                errors+=("CHANGELOG.md is out of order: $a appears before $b but $b is a higher version")
              fi
            done
          fi
        elif [ "$changelog_format" = "date" ]; then
          valid_dates=()
          for h in "${headings[@]}"; do
            if [[ "$h" =~ $date_re ]]; then
              valid_dates+=("$h")
            fi
          done

          if [ ${#valid_dates[@]} -ge 2 ]; then
            for ((i=0; i<${#valid_dates[@]}-1; i++)); do
              a="${valid_dates[$i]}"
              b="${valid_dates[$((i+1))]}"
              if [[ "$b" > "$a" ]]; then
                errors+=("CHANGELOG.md is out of order: $a appears before $b but $b is a later date")
              fi
            done
          fi
        fi

        # --- Check for empty changelog entries ---
        empty_sections=$(awk '
          /^##[[:space:]]/ {
            if (heading != "" && content == 0) print heading
            heading = $0; content = 0; next
          }
          heading != "" && /[^ \t]/ && !/^#/ { content = 1 }
        END {
          if (heading != "" && content == 0) print heading
        }' CHANGELOG.md | grep -iv 'unreleased' || true)

        if [ -n "$empty_sections" ]; then
          while IFS= read -r section; do
            errors+=("CHANGELOG.md has empty section: $section")
          done <<< "$empty_sections"
        fi

        # --- Report ---
        if [ ${#errors[@]} -gt 0 ]; then
          for err in "${errors[@]}"; do
            echo "::error::$err"
          done
          exit 1
        fi

        echo "Version sync check passed"
