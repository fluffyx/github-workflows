name: Check version sync
description: >
  Auto-discovers version-bearing files (VERSION, package.json, version.rb)
  and verifies they agree. Requires CHANGELOG.md to exist. Supports two
  changelog formats: semver (## [1.2.3]) and date (## [2026-04-12]).
  Semver prerelease (1.2.3-beta.1) and build metadata (1.2.3+build) are
  accepted. Auto-detects format from headings — mixing formats is not
  allowed. For semver changelogs, validates against discovered version
  sources. For date changelogs, validates ISO 8601 format and descending
  order. Ordering validation applies to release versions only — prerelease
  headings are skipped.

  The same logic is also exposed as a lefthook pre-push hook via the
  shared lefthook config at lefthook-shared.yml in this repo.

runs:
  using: composite
  steps:
    - name: Check version sync
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/check-version.sh"
